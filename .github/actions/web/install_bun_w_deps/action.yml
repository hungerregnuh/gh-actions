name: 'Install bun and dependencies'
description: 'Installs a specific version of bun and project dependencies'
inputs:
  bun-version:
    description: 'The version of bun to install.'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Installing bun v${{ inputs.bun-version }}
      id: install-bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}
      working-directory: ${{ github.action_path }}
    - name: Install dependencies
      id: install-deps
      run: bun install
      shell: bash
      working-directory: ${{ github.action_path }}
